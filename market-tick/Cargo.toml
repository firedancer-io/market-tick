[package]
name = "market-tick"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sub-slot market tick Solana program"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anchor-lang = { workspace = true }
market-tick-abi = { workspace = true }

[dev-dependencies]
# These are client-side SDK crates for RPC tests. Surfpool supplies the Agave
# 4.x runtime that executes the compiled SBF artifact.
serde_json = "1"
solana-commitment-config = "3"
solana-epoch-info = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-pubkey = "3"
solana-rpc-client = "3"
solana-signer = "3"
solana-system-interface = { version = "2", features = ["bincode"] }
solana-transaction = "3"
solana-transaction-error = "3"

[features]
# When set, no entrypoint is compiled (useful when linking the program as a lib
# into other programs or tests).
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
anchor-debug = ["anchor-lang/anchor-debug"]
idl-build = ["anchor-lang/idl-build"]

[lints]
workspace = true
