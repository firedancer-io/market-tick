[package]
name = "market-tick"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sub-slot market tick Solana program"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anchor-lang = { workspace = true }
market-tick-abi = { workspace = true }

# Native program-test needs the legacy syscall-stub wrapper. This dependency is
# excluded from SBF builds; on-chain CPI goes through Anchor's re-export.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-program = { version = "2", default-features = false }

[dev-dependencies]
# Runtime crates are test-only; the deployed program depends on Anchor's
# stable Solana interfaces instead of an Agave release line.
solana-program-test = "2.3.13"
solana-instruction = "2"
solana-keypair = "2"
solana-pubkey = "2"
solana-signer = "2"
solana-system-interface = "1"
solana-transaction = "2"
solana-transaction-error = "2"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }

[features]
# When set, no entrypoint is compiled (useful when linking the program as a lib
# into other programs or tests).
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
anchor-debug = ["anchor-lang/anchor-debug"]
idl-build = ["anchor-lang/idl-build"]

[lints]
workspace = true
