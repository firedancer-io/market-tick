[workspace]
resolver = "2"
members = [
    "crates/market-tick-abi",
    "market-tick",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/example/market-tick"

# Allow target cfgs emitted by the Solana/Anchor entrypoint macros.
[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint", "custom-heap", "custom-panic"))',
    'cfg(target_arch, values("sbf"))',
]

[workspace.dependencies]
market-tick-abi = { path = "crates/market-tick-abi" }
anchor-lang = "=1.1.2"
solana-pubkey = { version = "3", default-features = false, features = ["curve25519"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
